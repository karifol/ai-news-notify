version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - pip install --upgrade aws-sam-cli

  build:
    commands:
      - sam build
      - sam package
          --s3-bucket $ARTIFACT_BUCKET
          --output-template-file packaged.yaml

artifacts:
  files:
    - packaged.yaml
